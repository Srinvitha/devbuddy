<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Coding Buddy</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/buddy.css">

</head>

<body>

<header>

    <h1>AI Coding Buddy</h1>

    <a href="/">Home</a>

</header>

<main>

    <div id="chat">

        <div class="ai">

            Hello! Ask me anything related to programming.

        </div>

    </div>

    <div class="input-area">

        <textarea
                id="message"
                placeholder="Ask a programming question..."
        ></textarea>

        <button id="send">

            Send

        </button>

    </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/buddy.js"></script>

</body>

</html>
